<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Item List · Coffee Menu</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ── Top bar ─────────────────────────────────────────── -->
    <header class="topbar">
      <nav class="crumbs" aria-label="Breadcrumb">
        <span class="crumbs__badge" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
            <rect x="3" y="3" width="6" height="6" rx="1.6" fill="currentColor"/>
            <rect x="11" y="3" width="6" height="6" rx="1.6" fill="currentColor" opacity=".45"/>
            <rect x="3" y="11" width="6" height="6" rx="1.6" fill="currentColor" opacity=".45"/>
            <rect x="11" y="11" width="6" height="6" rx="1.6" fill="currentColor"/>
          </svg>
        </span>
        <a class="crumbs__link" href="#">Menu</a>
        <svg class="crumbs__sep" viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
          <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="crumbs__current" aria-current="page">Item List</span>
      </nav>

      <div class="topbar__meta">
        <span class="pill-count"><span id="topCount">12</span> items</span>
      </div>
    </header>

    <main class="page">
      <!-- ── Toolbar ───────────────────────────────────────── -->
      <section class="toolbar" aria-label="Table controls">
        <label class="search">
          <svg class="search__icon" viewBox="0 0 20 20" width="17" height="17" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="5.6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="Search by name, item ID..." autocomplete="off" aria-label="Search items" />
          <kbd class="search__kbd">⌘K</kbd>
        </label>

        <div class="toolbar__filters">
          <button class="fbtn" id="statusFilter" data-menu="status" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
              <circle cx="10" cy="10" r="6.4" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 6.4V10l2.4 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="fbtn__label" id="statusFilterLabel">All Status</span>
            <svg class="fbtn__caret" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
              <path d="M4 6.2l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="fbtn" id="dateFilter" data-menu="date" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
              <rect x="3.2" y="4.8" width="13.6" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3.4 8.6h13.2M7 3.2v3M13 3.2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="fbtn__label" id="dateFilterLabel">01 Jan 2025 → 30 Jun</span>
            <svg class="fbtn__caret" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
              <path d="M4 6.2l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="fbtn fbtn--quiet" id="moreFilters" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" aria-hidden="true">
              <path d="M4.2 12.5V7.5M4.2 5.2a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2zM10 14.6V9.6M10 7.3a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2zM15.8 12.5V7.5M15.8 5.2a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="fbtn__label">More Filters</span>
            <span class="fbtn__dot" id="moreFiltersDot" hidden></span>
          </button>
        </div>
      </section>

      <!-- ── Table card ────────────────────────────────────── -->
      <section class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th class="col-item" scope="col">
                  <button class="sort" data-sort="name">Item Name <span class="sort__arrow" aria-hidden="true"></span></button>
                </th>
                <th class="col-price" scope="col">
                  <button class="sort" data-sort="price">Price &amp; Sell Price <span class="sort__arrow" aria-hidden="true"></span></button>
                </th>
                <th class="col-status" scope="col">Status</th>
                <th class="col-rating" scope="col">
                  <button class="sort" data-sort="rating">Score &amp; Rating <span class="sort__arrow" aria-hidden="true"></span></button>
                </th>
              </tr>
            </thead>
            <tbody id="rows"><!-- rendered by app.js --></tbody>
          </table>
        </div>

        <footer class="table-footer">
          <p class="footer__count" id="resultCount">Showing 1–8 of 12 items</p>

          <div class="footer__controls">
            <label class="perpage">
              <span>Rows</span>
              <select id="perPage" aria-label="Rows per page">
                <option value="5">5</option>
                <option value="8" selected>8</option>
                <option value="12">12</option>
              </select>
            </label>
            <div class="pager" id="pager"><!-- rendered by app.js --></div>
          </div>
        </footer>
      </section>
    </main>
  </div>

  <!-- Popover host -->
  <div id="popoverHost"></div>

  <!-- Details drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Item details" aria-hidden="true">
    <div class="drawer__inner" id="drawerInner"></div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
