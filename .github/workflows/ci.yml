name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies: the theme and its tests use the built-in test runner only.
      - run: npm test
      - run: docker build -t coffee-menu:ci .
